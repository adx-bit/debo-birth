<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0e68c;
            font-family: 'Arial', sans-serif;
            text-align: center;
        }
        h1 {
            color: #ff69b4;
        }
        #cake {
            width: 200px;
            position: relative;
            margin: 20px;
        }
        .candle {
            width: 10px;
            height: 20px;
            background-color: #ff4500;
            position: absolute;
            bottom: 100%;
            left: 20px;
            border-radius: 5px;
        }
        .flame {
            width: 5px;
            height: 5px;
            background-color: #ffcc00;
            border-radius: 50%;
            position: absolute;
            top: -5px;
            left: 2.5px;
            animation: flicker 0.5s infinite alternate;
        }
        @keyframes flicker {
            0% { opacity: 1; }
            100% { opacity: 0.5; }
        }
        #gift {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #ff69b4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .heart {
            position: absolute;
            color: red;
            font-size: 24px;
            animation: fall 2s forwards;
        }
        @keyframes fall {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }
    </style>
</head>
<body>

    <h1>Happy Birthday, [DeboPriya]!</h1>
    <div id="cake">
              <div class="candle" style="left: 10px;"><div class="flame"></div></div>
            <div class="candle" style="left: 50px;"><div class="flame"></div></div>
           <div class="candle" style="left: 90px;"><div class="flame"></div></div>
          <div class="candle" style="left: 90px;"><div class="flame"></div></div>
     </div> &#127874; 
     </div> &#127874; 
     </div> &#127874; 


    
    <p>Wishing you a day filled with love, joy, and all your favorite things!</p>
    <button id="gift">🎁 Click for a Surprise!</button>

    <script>
        document.getElementById('gift').addEventListener('click', function() {
            for (let i = 0; i < 50; i++) {
                createHeart();
            }
        });

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤';
            heart.style.left = Math.random() * window.innerWidth + 'px';
            heart.style.top = '0px';
            document.body.appendChild(heart);
            setTimeout(() => {
                heart.remove();
            }, 2000);
        }
    </script>

</body>
</html>
